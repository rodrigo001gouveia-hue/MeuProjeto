<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintetizador Musical - Meu Portfólio</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <h1>Sintetizador Front-End Criativo</h1>
        <p>Toque usando os botões na tela ou as teclas do seu teclado (A, S, D, F, G, H, J)</p>
    </header>
    
    <div id= "visualizador">
        <div class="form" id="circulo"></div>
    </div>

    <div class="piano">
        <button class="tecla" data-nota="261.63">Dó (A)</button> 
        <button class="tecla" data-nota="293.66">Ré (S)</button>
        <button class="tecla" data-nota="329.63">Mi (D)</button>
        <button class="tecla" data-nota="349.23">Fá (F)</button>
        <button class="tecla" data-nota="392.00">Sol (G)</button>
        <button class="tecla" data-nota="440.00">Lá (H)</button>
        <button class="tecla" data-nota="493.88">Si (J)</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
